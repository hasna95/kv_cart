<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}KV Cart{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-left" onclick="window.location.href='/dashboard'">KV Cart</div>
    <div class="navbar-center">
      <a href="/dashboard">Home</a>
      <a href="/wishlist">Wishlist</a>
      <a href="#">About</a>
      <a href="#">Career</a>
    </div>
    <div class="navbar-right">
      <form class="search-form" action="/search" method="get">
        <input type="text" name="q" class="search-input" placeholder="Search...">
      </form>
      <div style="position: relative;">
        <button class="icon-btn" onclick="window.location.href='/cart'">
  🛒 <span id="cart-count" class="badge" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;padding:2px 6px;font-size:12px;">0</span>
</button>
      </div>
      <div style="position: relative;">
        <button class="icon-btn" onclick="window.location.href='/wishlist'">💖</button>
        <span id="wishlist-count" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;padding:2px 6px;font-size:12px;">0</span>
      </div>
      <div class="account-dropdown">
        <button class="icon-btn">👤</button>
        <div class="dropdown-content">
    {% if 'user_id' in session %}
      <a href="/logout">Logout</a>
    {% else %}
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    {% endif %}
  </div>
      </div>
    </div>
  </nav>
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  {% block content %}{% endblock %}
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
<!-- Login Modal -->
<div id="loginModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="close" onclick="closeLoginModal()">&times;</span>
    <h2>Login Required</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="login-error" style="color: red;"></p>
  </div>
</div>
<script>
  let pendingAction = null;  // 🔥 Save the user's action to retry after login

// Open Login Modal and save the callback
function openLoginModal(callbackAfterLogin) {
  pendingAction = callbackAfterLogin;
  document.getElementById('loginModal').style.display = 'flex';
}

// Close Login Modal
function closeLoginModal() {
  document.getElementById('loginModal').style.display = 'none';
  pendingAction = null;
}

// Handle login form submit inside modal
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  fetch('/api/login', {   // ✅ Corrected
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      closeLoginModal();
      if (pendingAction) {
  setTimeout(() => {
    pendingAction();  // Retry after short delay
  }, 300); // wait 300 milliseconds
}
    } else {
      document.getElementById('login-error').innerText = data.message || "Login failed.";
    }
  })
  .catch(err => {
    document.getElementById('login-error').innerText = "An error occurred.";
  });
});

</script>

</body>
</html>
